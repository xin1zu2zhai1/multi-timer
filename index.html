<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイマー</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #d9dde3;
    --primary: #2563eb;
    --primary-text: #ffffff;
    --work: #dc2626;
    --break: #16a34a;
    --btn: #eef0f3;
    --btn-hover: #e2e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --card: #1b1f24;
      --text: #e6e8eb;
      --muted: #9aa3ad;
      --border: #333a42;
      --primary: #3b82f6;
      --btn: #262b31;
      --btn-hover: #30363d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 16px; text-align: center; }

  .tabs { display: flex; gap: 4px; background: var(--btn); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .tab {
    flex: 1; border: none; background: transparent; color: var(--muted);
    padding: 10px 4px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600;
    white-space: nowrap;
  }
  @media (max-width: 420px) { .tab { font-size: 0.8rem; } }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .phase { text-align: center; font-weight: 700; height: 1.5em; letter-spacing: .05em; }
  .phase.work { color: var(--work); }
  .phase.break { color: var(--break); }

  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 15vw, 4.75rem);
    font-weight: 700;
    text-align: center;
    margin: 4px 0 4px;
    letter-spacing: .02em;
  }
  .display.done { animation: blink 1s steps(2, start) infinite; color: var(--work); }
  @keyframes blink { to { visibility: hidden; } }
  .sub { text-align: center; color: var(--muted); font-size: .85rem; height: 1.4em; margin-bottom: 16px; }

  .section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .label { font-size: .85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .label.work { color: var(--work); }
  .label.break { color: var(--break); }

  .inputs { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .inputs input {
    width: 64px; padding: 8px 4px; font-size: 1.25rem; text-align: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .inputs span { color: var(--muted); font-size: .85rem; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button.btn {
    border: 1px solid var(--border); background: var(--btn); color: var(--text);
    padding: 10px 16px; border-radius: 8px; font-size: .95rem; cursor: pointer; font-weight: 600;
    min-width: 72px;
  }
  button.btn:hover { background: var(--btn-hover); }
  button.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); min-width: 140px; }
  button.btn.primary:hover { filter: brightness(1.08); }
  button.btn.toggle.on { background: var(--break); border-color: var(--break); color: #fff; }
  .controls { margin-top: 20px; }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn:disabled:hover { background: var(--btn); }
  .display.sw { font-size: clamp(2.5rem, 12.5vw, 4.75rem); }
  .display .ms { font-size: .45em; color: var(--muted); }
  .inputs input.narrow { width: 52px; }
  .note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 8px; min-height: 1.2em; }
  .footer { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; text-align: center; }
  button.btn.small { padding: 6px 12px; font-size: .85rem; }

  .laps { list-style: none; margin: 16px 0 0; padding: 0; max-height: 260px; overflow-y: auto;
          border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .laps li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: .95rem; }
  .laps li .n { color: var(--muted); min-width: 4.5em; }
  .laps li .t { color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="app">
  <h1>タイマー</h1>

  <div class="tabs" role="tablist">
    <button class="tab active" data-mode="normal" role="tab">通常モード</button>
    <button class="tab" data-mode="pomodoro" role="tab">ポモドーロ</button>
    <button class="tab" data-mode="stopwatch" role="tab">ストップウォッチ</button>
  </div>

  <div id="phase" class="phase"></div>
  <div id="display" class="display">00:00:00</div>
  <div id="sub" class="sub"></div>

  <!-- 通常モード -->
  <section id="normalPanel">
    <div class="section">
      <div class="label">時間を入力</div>
      <div class="inputs">
        <input id="nH" type="number" min="0" max="99" value="0" inputmode="numeric"><span>時</span>
        <input id="nM" type="number" min="0" max="59" value="5" inputmode="numeric"><span>分</span>
        <input id="nS" type="number" min="0" max="59" value="0" inputmode="numeric"><span>秒</span>
      </div>
      <div class="row">
        <button class="btn" data-preset="300">5分</button>
        <button class="btn" data-preset="600">10分</button>
        <button class="btn" data-preset="1800">30分</button>
      </div>
    </div>
    <div class="row controls">
      <button id="nStart" class="btn primary">スタート</button>
      <button id="nClear" class="btn">クリア</button>
      <button id="nSet" class="btn">セット</button>
    </div>
  </section>

  <!-- ポモドーロ・モード -->
  <section id="pomoPanel" class="hidden">
    <div class="section">
      <div class="label work">実行時間</div>
      <div class="inputs">
        <input id="wH" type="number" min="0" max="99" value="0" inputmode="numeric"><span>時</span>
        <input id="wM" type="number" min="0" max="59" value="25" inputmode="numeric"><span>分</span>
        <input id="wS" type="number" min="0" max="59" value="0" inputmode="numeric"><span>秒</span>
      </div>
      <div class="row">
        <button class="btn" data-work="900">15分</button>
        <button class="btn" data-work="1500">25分</button>
        <button class="btn" data-work="3000">50分</button>
      </div>
    </div>
    <div class="section">
      <div class="label break">休憩時間</div>
      <div class="inputs">
        <input id="bH" type="number" min="0" max="99" value="0" inputmode="numeric"><span>時</span>
        <input id="bM" type="number" min="0" max="59" value="5" inputmode="numeric"><span>分</span>
        <input id="bS" type="number" min="0" max="59" value="0" inputmode="numeric"><span>秒</span>
      </div>
      <div class="row">
        <button class="btn" data-break="300">5分</button>
        <button class="btn" data-break="600">10分</button>
        <button class="btn" data-break="900">15分</button>
      </div>
    </div>
    <div class="section">
      <div class="label break">長い休憩</div>
      <div class="inputs">
        <input id="lH" type="number" min="0" max="99" value="0" inputmode="numeric"><span>時</span>
        <input id="lM" type="number" min="0" max="59" value="15" inputmode="numeric"><span>分</span>
        <input id="lS" type="number" min="0" max="59" value="0" inputmode="numeric"><span>秒</span>
      </div>
      <div class="row">
        <button class="btn" data-long="900">15分</button>
        <button class="btn" data-long="1200">20分</button>
        <button class="btn" data-long="1800">30分</button>
      </div>
      <div class="inputs" style="margin-top:12px">
        <span>実行</span>
        <input id="lEvery" class="narrow" type="number" min="0" max="99" value="4" inputmode="numeric">
        <span>回ごとに長い休憩</span>
      </div>
      <div class="note" style="margin-top:0">0回、または長い休憩を0分にすると無効になります</div>
    </div>
    <div class="row controls">
      <button id="pStart" class="btn primary">スタート</button>
      <button id="pClear" class="btn">クリア</button>
      <button id="pSet" class="btn">セット</button>
      <button id="pLoop" class="btn toggle" aria-pressed="false">ループ: OFF</button>
    </div>
  </section>

  <!-- ストップウォッチ -->
  <section id="swPanel" class="hidden">
    <div class="row controls">
      <button id="swStart" class="btn primary">スタート</button>
      <button id="swClear" class="btn">クリア</button>
      <button id="swLap" class="btn" disabled>ラップ</button>
    </div>
    <ol id="laps" class="laps"></ol>
  </section>

  <div class="footer">
    <button id="notifyBtn" class="btn toggle small" aria-pressed="false">デスクトップ通知: OFF</button>
    <div id="notifyMsg" class="note"></div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const display = $('display'), phaseEl = $('phase'), subEl = $('sub');

  // ---------- 共通 ----------
  let mode = 'normal';
  let remaining = 0;      // 残り秒数（停止中）
  let endAt = 0;          // 終了予定時刻 (ms)
  let tickId = null;
  let running = false;

  // ポモドーロ状態
  let phase = 'work';     // 'work' | 'break'
  let loop = false;
  let cycle = 1;

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (sec) => {
    sec = Math.max(0, Math.ceil(sec));
    return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec % 3600 / 60))}:${pad(sec % 60)}`;
  };
  const clampInt = (v, max) => Math.min(max, Math.max(0, parseInt(v, 10) || 0));
  const readInputs = (p) => clampInt($(p+'H').value, 99) * 3600 + clampInt($(p+'M').value, 59) * 60 + clampInt($(p+'S').value, 59);
  const writeInputs = (p, sec) => {
    $(p+'H').value = Math.floor(sec / 3600);
    $(p+'M').value = Math.floor(sec % 3600 / 60);
    $(p+'S').value = sec % 60;
  };

  function render(sec) {
    const t = fmt(sec);
    display.textContent = t;
    document.title = running ? `${t} - タイマー` : 'タイマー';
  }

  function updateButtons() {
    const label = running ? 'ストップ' : 'スタート';
    $('nStart').textContent = label;
    $('pStart').textContent = label;
  }

  function stopTick() {
    if (tickId) clearInterval(tickId);
    tickId = null;
  }

  // auto=true: ポモドーロの自動切替（鳴っているアラームを止めない）
  function start(auto = false) {
    if (remaining <= 0) return false;
    unlockAudio();
    if (!auto) stopAlarm();
    display.classList.remove('done');
    running = true;
    endAt = Date.now() + remaining * 1000;
    stopTick();
    tickId = setInterval(tick, 200);
    tick();
    updateButtons();
    return true;
  }

  // ポモドーロのフェーズ切替時、アラームの間（1秒）00:00:00 を表示してから次へ進む
  const HOLD_MS = 1000;
  let hold = null; // { id, apply }
  function holdThen(apply) {
    running = true;
    updateButtons();
    hold = { apply, id: setTimeout(() => { hold = null; apply(); start(true); }, HOLD_MS) };
  }

  function stop() {
    if (hold) {
      // 待機中に止めた場合は、次のフェーズの先頭で停止する
      const h = hold; hold = null;
      clearTimeout(h.id);
      h.apply();
      running = false;
      stopTick();
      updateButtons();
      render(remaining);
      return;
    }
    if (running) remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    running = false;
    stopTick();
    updateButtons();
    render(remaining);
  }

  function tick() {
    const left = (endAt - Date.now()) / 1000;
    if (left <= 0) {
      remaining = 0;
      render(0);
      onFinish();
    } else {
      render(left);
    }
  }

  function onFinish() {
    running = false;
    stopTick();
    if (mode === 'normal') {
      display.classList.add('done');
      subEl.textContent = '時間になりました';
      playAlarm(6);
      notify('時間になりました', 'タイマーが終了しました');
      updateButtons();
      return;
    }
    // ポモドーロ
    if (phase === 'work') {
      playWorkEnd();
      const isLong = longDue();
      const b = isLong ? readInputs('l') : readInputs('b');
      if (b > 0) {
        const name = isLong ? '長い休憩' : '休憩';
        notify(`${name}に入ります`, `サイクル ${cycle} の実行が終わりました（${name} ${fmtLen(b)}）`);
        holdThen(() => { setPhase(isLong ? 'long' : 'break'); remaining = b; });
        return;
      }
      // 休憩0なら次へ
    } else {
      playBreakEnd();
    }
    // 休憩終了
    if (loop) {
      const w = readInputs('w');
      notify('実行を開始します', `サイクル ${cycle + 1}（${fmtLen(w)}）`);
      holdThen(() => { cycle++; setPhase('work'); remaining = w; });
    } else {
      setPhase('work');
      remaining = 0;
      display.classList.add('done');
      subEl.textContent = 'ポモドーロ終了';
      notify('ポモドーロ終了', 'お疲れさまでした');
      updateButtons();
    }
  }

  // ---------- モード切替 ----------
  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      if (tab.dataset.mode === mode) return;
      stop(); swPause(); stopAlarm();
      mode = tab.dataset.mode;
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
      $('normalPanel').classList.toggle('hidden', mode !== 'normal');
      $('pomoPanel').classList.toggle('hidden', mode !== 'pomodoro');
      $('swPanel').classList.toggle('hidden', mode !== 'stopwatch');
      display.classList.remove('done');
      display.classList.toggle('sw', mode === 'stopwatch');
      if (mode === 'pomodoro') { cycle = 1; setPhase('work'); setPomo(); return; }
      phaseEl.textContent = ''; phaseEl.className = 'phase';
      if (mode === 'normal') setNormal();
      else { subEl.textContent = ''; swRender(); }
    });
  });

  // ---------- 通常モード ----------
  function setNormal() {
    stop(); stopAlarm();
    display.classList.remove('done');
    remaining = readInputs('n');
    subEl.textContent = '';
    render(remaining);
  }
  document.querySelectorAll('[data-preset]').forEach((b) => {
    b.addEventListener('click', () => { writeInputs('n', +b.dataset.preset); setNormal(); });
  });
  $('nSet').addEventListener('click', setNormal);
  $('nStart').addEventListener('click', () => {
    if (running) { stop(); return; }
    if (remaining <= 0) remaining = readInputs('n');
    subEl.textContent = '';
    start();
  });
  $('nClear').addEventListener('click', () => {
    stop(); stopAlarm();
    display.classList.remove('done');
    writeInputs('n', 0);
    remaining = 0;
    subEl.textContent = '';
    render(0);
  });

  // ---------- ポモドーロ・モード ----------
  const PHASE_LABEL = { work: '実行中', break: '休憩中', long: '長い休憩中' };
  function longEvery() {
    const every = clampInt($('lEvery').value, 99);
    return every > 0 && readInputs('l') > 0 ? every : 0;
  }
  // 今のサイクルの実行が終わったら長い休憩か
  function longDue() {
    const every = longEvery();
    return every > 0 && cycle % every === 0;
  }
  function setPhase(p) {
    phase = p;
    phaseEl.textContent = PHASE_LABEL[p];
    phaseEl.className = 'phase ' + (p === 'long' ? 'break' : p);
    const every = longEvery();
    const pos = every ? `　長い休憩まで ${(cycle - 1) % every + 1}/${every}` : '';
    subEl.textContent = `サイクル ${cycle}` + (loop ? '（ループ中）' : '') + pos;
  }
  function setPomo() {
    stop(); stopAlarm();
    display.classList.remove('done');
    cycle = 1;
    setPhase('work');
    remaining = readInputs('w');
    render(remaining);
  }
  document.querySelectorAll('[data-work]').forEach((b) => {
    b.addEventListener('click', () => { writeInputs('w', +b.dataset.work); if (phase === 'work' || !running) setPomo(); });
  });
  document.querySelectorAll('[data-long]').forEach((b) => {
    b.addEventListener('click', () => { writeInputs('l', +b.dataset.long); if (!running) setPomo(); });
  });
  document.querySelectorAll('[data-break]').forEach((b) => {
    b.addEventListener('click', () => { writeInputs('b', +b.dataset.break); if (!running) setPomo(); });
  });
  $('pSet').addEventListener('click', setPomo);
  // 長い休憩の設定を変えたら、サイクル表示を更新
  ['lEvery', 'lH', 'lM', 'lS'].forEach((id) => $(id).addEventListener('input', () => { if (mode === 'pomodoro') setPhase(phase); }));
  $('pStart').addEventListener('click', () => {
    if (running) { stop(); return; }
    if (remaining <= 0) { cycle = 1; setPhase('work'); remaining = readInputs('w'); }
    setPhase(phase);
    start();
  });
  $('pClear').addEventListener('click', () => {
    stop(); stopAlarm();
    display.classList.remove('done');
    cycle = 1;
    setPhase('work');
    remaining = 0;
    render(0);
  });
  $('pLoop').addEventListener('click', () => {
    loop = !loop;
    const b = $('pLoop');
    b.classList.toggle('on', loop);
    b.setAttribute('aria-pressed', loop);
    b.textContent = `ループ: ${loop ? 'ON' : 'OFF'}`;
    setPhase(phase);
  });

  // 入力欄でEnter → セット
  document.querySelectorAll('.inputs input').forEach((inp) => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') (mode === 'normal' ? setNormal : setPomo)();
    });
  });

  // ---------- アラーム (Web Audio API) ----------
  let ctx = null;
  let alarmNodes = [];
  function unlockAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function beep(t, freq, dur, type = 'square') {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
    alarmNodes.push(osc);
  }
  // repeats: ピピピッ を何回鳴らすか / low: 休憩終了用に音程を変える
  function playAlarm(repeats, low = false) {
    unlockAudio();
    if (!ctx) return;
    const f = low ? 660 : 880;
    let t = ctx.currentTime + 0.05;
    for (let r = 0; r < repeats; r++) {
      for (let i = 0; i < 4; i++) { beep(t, f, 0.12); t += 0.16; }
      t += 0.5;
    }
  }
  // ポモドーロ用の短いアラーム（約1秒で自動的に止まる）
  // 実行終了 → 休憩へ：上昇する明るい3音「ピロリン」
  function playWorkEnd() {
    unlockAudio();
    if (!ctx) return;
    const t = ctx.currentTime + 0.05;
    beep(t, 784, 0.18, 'sine');          // ソ
    beep(t + 0.18, 988, 0.18, 'sine');   // シ
    beep(t + 0.36, 1319, 0.45, 'sine');  // ミ
  }
  // 休憩終了 → 実行へ：低めの「ポーン、ポーン」
  function playBreakEnd() {
    unlockAudio();
    if (!ctx) return;
    const t = ctx.currentTime + 0.05;
    beep(t, 523, 0.35, 'triangle');        // ド
    beep(t + 0.45, 523, 0.5, 'triangle');  // ド
  }
  function stopAlarm() {
    alarmNodes.forEach((o) => { try { o.stop(); } catch (_) {} });
    alarmNodes = [];
  }
  // 終了表示中に画面をクリックしたらアラーム停止
  display.addEventListener('click', () => { stopAlarm(); display.classList.remove('done'); });

  // ---------- ストップウォッチ ----------
  let swElapsed = 0;     // 停止までに経過したミリ秒
  let swStartAt = 0;
  let swRunning = false;
  let swId = null;
  let laps = [];         // 各ラップ時点の合計ミリ秒
  const swNow = () => swElapsed + (swRunning ? Date.now() - swStartAt : 0);
  function splitMs(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const sec = Math.floor(ms / 1000);
    return [fmt(sec), pad(cs)];
  }
  function swRender() {
    if (mode !== 'stopwatch') return;
    const [hms, cs] = splitMs(swNow());
    display.innerHTML = `${hms}<span class="ms">.${cs}</span>`;
    document.title = swRunning ? `${hms} - ストップウォッチ` : 'タイマー';
  }
  function swUpdateButtons() {
    $('swStart').textContent = swRunning ? 'ストップ' : 'スタート';
    $('swLap').disabled = !swRunning;
  }
  function swPause() {
    if (!swRunning) return;
    swElapsed = swNow();
    swRunning = false;
    clearInterval(swId); swId = null;
    swUpdateButtons();
    swRender();
  }
  function renderLaps() {
    const list = $('laps');
    list.innerHTML = '';
    for (let i = laps.length - 1; i >= 0; i--) {
      const lap = laps[i] - (i ? laps[i - 1] : 0);
      const [lh, lc] = splitMs(lap), [th, tc] = splitMs(laps[i]);
      const li = document.createElement('li');
      li.innerHTML = `<span class="n">ラップ ${i + 1}</span><span>${lh}.${lc}</span><span class="t">${th}.${tc}</span>`;
      list.appendChild(li);
    }
  }
  $('swStart').addEventListener('click', () => {
    if (swRunning) { swPause(); return; }
    swStartAt = Date.now();
    swRunning = true;
    swId = setInterval(swRender, 31);
    swUpdateButtons();
    swRender();
  });
  $('swClear').addEventListener('click', () => {
    swPause();
    swElapsed = 0;
    laps = [];
    renderLaps();
    swRender();
  });
  $('swLap').addEventListener('click', () => {
    if (!swRunning) return;
    laps.push(swNow());
    renderLaps();
  });

  // ---------- デスクトップ通知 ----------
  const notifyBtn = $('notifyBtn'), notifyMsg = $('notifyMsg');
  const canNotify = 'Notification' in window;
  let notifyOn = false;
  try { notifyOn = localStorage.getItem('multiTimer.notify') === '1'; } catch (_) {}
  function saveNotify() {
    try { localStorage.setItem('multiTimer.notify', notifyOn ? '1' : '0'); } catch (_) {}
  }
  function updateNotifyBtn() {
    const on = notifyOn && canNotify && Notification.permission === 'granted';
    notifyBtn.classList.toggle('on', on);
    notifyBtn.setAttribute('aria-pressed', on);
    notifyBtn.textContent = `デスクトップ通知: ${on ? 'ON' : 'OFF'}`;
    if (!canNotify) notifyMsg.textContent = 'このブラウザは通知に対応していません';
    else if (Notification.permission === 'denied') notifyMsg.textContent = '通知がブロックされています。ブラウザのサイト設定で許可してください';
    else notifyMsg.textContent = on ? 'タイマーの終了やフェーズの切り替えを通知します' : '';
  }
  notifyBtn.addEventListener('click', async () => {
    if (!canNotify) { updateNotifyBtn(); return; }
    if (notifyOn && Notification.permission === 'granted') {
      notifyOn = false;
    } else if (Notification.permission === 'granted') {
      notifyOn = true;
    } else if (Notification.permission === 'default') {
      const p = await Notification.requestPermission();
      notifyOn = p === 'granted';
    }
    saveNotify();
    updateNotifyBtn();
  });
  function notify(title, body) {
    if (!notifyOn || !canNotify || Notification.permission !== 'granted') return;
    try {
      const n = new Notification(title, { body, tag: 'multi-timer' });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (_) { /* スマホなど new Notification が使えない環境では何もしない */ }
  }
  // 「25分」「1時間30分」のような表記
  function fmtLen(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? `${h}時間` : '') + (m ? `${m}分` : '') + (s ? `${s}秒` : '') || '0秒';
  }

  // 初期表示
  updateNotifyBtn();
  setNormal();
})();
</script>
</body>
</html>
